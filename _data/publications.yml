  - title: "How to Fine-tune the Model: Unified Model Shift and Model Bias Policy Optimization"
    acronym: USB-PO
    role: Core author
    venue: NeurIPS 2023
    summary: "Better predictive models do not always produce better policies. USB-PO jointly accounts for model shift and model bias with an adaptive model-update objective, improving sample efficiency on six MuJoCo tasks."
    authors: Hai Zhang, <strong>Hang Yu</strong>, Junqiao Zhao†, Di Zhang, Chang Huang, Hongtu Zhou, Xiao Zhang, Chen Ye
