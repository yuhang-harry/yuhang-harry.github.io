  - title: "Focus On What Matters: Separated Models For Visual-Based RL Generalization"
    acronym: SMG
    role: Co-author
    venue: NeurIPS 2024
    summary: "Visual RL can overfit to irrelevant backgrounds. SMG separates task-relevant foreground learning using reward and inverse-dynamics signals, improving generalization under visual distractions."
    authors: Di Zhang, Bowen Lv, Hai Zhang, Feifan Yang, Junqiao Zhao†, <strong>Hang Yu</strong>, Chang Huang, Hongtu Zhou, Chen Ye, Changjun Jiang
